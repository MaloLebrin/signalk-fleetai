name: Publish to npm

# Publishes `signalk-fleetai` when a `v*` tag is pushed (`git tag v0.1.0 && git push --tags`).
# The tag must match `version` in package.json. Requires the `NPM_TOKEN` repository
# secret (an npm granular access token with publish rights on the package) — see README.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
